<div class="container">
  <mat-toolbar color="primary">
    <span>Notifications</span>
    <span class="spacer"></span>
    <div>
      <button mat-button color="warn" *ngIf="unreadCount > 0" (click)="markAllAsRead()">
        Marquer tout comme lu ({{unreadCount}})
      </button>
      <button mat-button color="warn" (click)="clearAllNotifications()">
        Tout supprimer
      </button>
    </div>
  </mat-toolbar>

  <div class="content">
    <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

    <mat-table [dataSource]="dataSource" class="mat-elevation-z8">

      <!-- Type Column -->
      <ng-container matColumnDef="type">
        <mat-header-cell *matHeaderCellDef> Type </mat-header-cell>
        <mat-cell *matCellDef="let element">
          <span class="type-badge" [style.backgroundColor]="getTypeColor(element.type)" [style.color]="getTypeColor(element.type) === '#ffffff' ? '#000000' : '#ffffff'">
            {{getTypeLabel(element.type)}}
          </span>
        </mat-cell>
      </ng-container>

      <!-- Title Column -->
      <ng-container matColumnDef="title">
        <mat-header-cell *matHeaderCellDef> Titre </mat-header-cell>
        <mat-cell *matCellDef="let element">{{element.title}}</mat-cell>
      </ng-container>

      <!-- Message Column -->
      <ng-container matColumnDef="message">
        <mat-header-cell *matHeaderCellDef> Message </mat-header-cell>
        <mat-cell *matCellDef="let element">{{element.message}}</mat-cell>
      </ng-container>

      <!-- Created At Column -->
      <ng-container matColumnDef="createdAt">
        <mat-header-cell *matHeaderCellDef> Date </mat-header-cell>
        <mat-cell *matCellDef="let element">{{element.createdAt | date:'short'}}</mat-cell>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
        <mat-cell *matCellDef="let element">
          <button mat-icon-button color="primary" (click)="markAsRead(element.id!)"
                  [disabled]="element.isRead">
            <mat-icon>{{element.isRead ? 'check_circle_outline' : 'check_circle'}}</mat-icon>
          </button>
          <mat-divider *ngIf="!element.isRead" [vertical]="true"></mat-divider>
          <button mat-icon-button color="warn" (click)="deleteNotification(element.id!)">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20, 50]" showFirstLastButtons></mat-paginator>
  </div>
</div>
