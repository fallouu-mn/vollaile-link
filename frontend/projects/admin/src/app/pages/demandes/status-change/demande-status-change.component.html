<div class="container">
  <mat-toolbar color="primary">
    <span>Changer le statut de la demande</span>
    <span class="spacer"></span>
    <button mat-button color="primary" routerLink="../">
      <mat-icon>arrow_back</mat-icon>
      Retour à la liste
    </button>
  </mat-toolbar>

  <div class="content">
    <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>

    <form [formGroup]="statusForm" (ngSubmit)="onSubmit()" class="form">
      <mat-grid-list cols="2" rowHeight="1:1" gutterSize="10px">
        <mat-grid-tile>
          <mat-form-field appearance="fill">
            <mat-label>Nouveau statut *</mat-label>
            <mat-select formControlName="statut" required>
              <mat-option value="EN_COURS">En cours</mat-option>
              <mat-option value="VALIDEE">Validée</mat-option>
              <mat-option value="REFUSEE">Refusée</mat-option>
              <mat-option value="EXPIREE">Expirée</mat-option>
              <mat-option value="SANS_SUITE">Sans suite</mat-option>
            </mat-select>
            <mat-error *ngIf="f['statut'].hasError('required')">
              Le statut est requis
            </mat-error>
          </mat-form-field>
        </mat-grid-tile>

        <mat-grid-tile colspan="2">
          <mat-form-field appearance="fill">
            <mat-label>Commentaires administratifs</mat-label>
            <textarea matInput formControlName="commentairesAdmin"></textarea>
          </mat-form-field>
        </mat-grid-tile>
      </mat-grid-list>

      <div class="form-actions">
        <button mat-flat-button color="primary" type="submit" [disabled]="isLoading">
          <mat-icon *ngIf="isLoading">hourglass_empty</mat-icon>
          <span *ngIf="!isLoading">Enregistrer</span>
        </button>
        <button mat-button type="button" routerLink="../">
          Annuler
        </button>
      </div>
    </form>
  </div>
</div>
