version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vollailelink-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vollailelink}
      POSTGRES_USER: ${POSTGRES_USER:-vollailelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres_data:
