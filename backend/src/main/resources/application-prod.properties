# Production profile settings
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Production datasource: native PostgreSQL supplied by the environment
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Do not expose development tooling in production
spring.h2.console.enabled=false
springdoc.swagger-ui.enabled=false

# Logging
logging.level.org.springframework=WARN
logging.level.com.vollailelink=INFO

# TLS is expected to be terminated by the reverse proxy or configured here.
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SERVER_SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=tomcat

# Server port
server.port=${SERVER_PORT:8083}