# Development profile settings
# The local .env file is loaded from the repository root when the backend is
# started from the backend/ directory. It is optional and never committed.
spring.config.import=optional:file:../.env[.properties]
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Local native PostgreSQL (Windows)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/vollailelink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.vollailelink=DEBUG

# Local server
server.port=${SERVER_PORT:8083}

# H2 is intentionally not used by the native PostgreSQL dev profile.