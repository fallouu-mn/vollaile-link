# Base datasource: native PostgreSQL (local Windows or server environment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/vollailelink}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# H2 must not be exposed by the application configuration
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# springdoc-openapi
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Server port
server.port=${SERVER_PORT:8083}

# Stock / reservations
# Duree de validite d'une reservation avant liberation automatique.
# 20 minutes par defaut, conformement au plan de test (docs/TEST_PLAN.md, section 4).
stock.reservation.ttl-minutes=${STOCK_RESERVATION_TTL_MINUTES:20}
# Frequence du balayage des reservations expirees (5 minutes par defaut).
stock.reservation.scheduler-delay-ms=${STOCK_RESERVATION_SWEEP_MS:300000}
stock.reservation.scheduler-initial-delay-ms=${STOCK_RESERVATION_SWEEP_INITIAL_MS:60000}